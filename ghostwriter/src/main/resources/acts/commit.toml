description = '''
This act automates the process of documenting and committing code changes in a project. 
It analyzes file modifications, groups them by change type, generates clear and concise 
commit messages that follow the project's historical style, and provides the exact git or 
svn commands needed to commit each group. The act ensures all actions are executed automatically, 
without prompting the user for confirmation, and outputs results in plain text for easy integration. 
'''

# basedOn:
#   - Specifies the configuration profile or template that this configuration is derived from.
#   - Useful for inheritance or extending base settings, allowing you to override or add to the base configuration as needed.
# basedOn = 

# =========================
# AI Assistant Instructions
# =========================

# Multi-line string containing step-by-step instructions for the AI assistant.
# Guides the assistant on how to analyze code changes, generate commit messages,
# provide git commands, and format the output.
instructions = '''
You are a precise, minimal version-control assistant. Analyze file changes in the current directory (`.`) and generate grouped commit commands.
'''

# =========================
# Inputs Section
# =========================

# Multi-line string describing the input workflow for the assistant.
# Outlines the steps for checking the current directory status, grouping changes,
# and generating commit messages that match the project's historical style.
inputs = '''
Execute these steps strictly in order:

1. **Check Status:** Run the functional tool to check the repository status in the current folder (`.`) (e.g., `git status --short .`).
2. **Pre-condition Check:** 
   - If there are NO changed files (including modified, added, deleted, renamed, copied, or untracked), stop immediately and output: "No changes detected."
   - If changes exist, proceed to Step 3. Only process changes within the current directory (`.`) and its subdirectories.
3. **Analyze and Group:** Group the changed files by logical scope (e.g., feat, fix, docs, refactor, chore).
4. **Adopt Historical Style:** Analyze the project's recent git history. Identify the tone, structure, and formatting of past commit messages.
5. **Generate Commit Messages:** For each group, write a message in the active voice and present tense that matches the historical style. Use bullet points for multiple key changes.
6. **Generate Git Commands:** Create the exact staging (`git add`) and commit (`git commit -m`) commands for each group.

# Output Format (Strictly Plain Text, No Markdown)
Provide your output as plain text. Do not use Markdown code blocks (do not use ```), bolding (**), or list styling. Follow this exact template for each group:

---
Group Name: [Name]
Staging Command: git add [files]
Commit Command: git commit -m "[Commit Message Header]

- Bullet point 1
- Bullet point 2"
---

${public.prompt}
'''

# =========================
# Ghostwriter (gw) Section
# =========================
# This section contains configuration options for the Ghostwriter (gw) component.
# - path: Specifies the directory pattern to scan for changes.
#            "glob:." means the current directory and all subdirectories will be included.
#            This is useful for tools that need to analyze or process files within the project structure.

[gw]
# Directory pattern to scan for changes. "glob:." means the current directory and all subdirectories.
interactive = true

[default]
gw.path = "glob:."

# =========================
# Functional Tool Command Section
# =========================

[ft.command]
# denylist:
#   - Multi-line string containing patterns, keywords, or file/command signatures to be excluded from processing by functional tools.
#   - Each entry in the denylist should be placed on a separate line.
#   - Lines starting with '#' are treated as comments and ignored.
#   - Entries can be of two types:
#       - REGEX: Regular expressions for matching complex patterns in commands or file path.
#       - KEYWORD: Exact keywords or command fragments to match and exclude.
#   - Common use cases include preventing execution of dangerous commands, excluding sensitive files, or blocking specific operations.
denylist = '''
${super.value}
'''