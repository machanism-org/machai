guidance_rules = # IMPORTANT INSTRUCTIONS\r\n\r\n## Scope\r\nThese instructions must be applied to the current file being processed at the path: PROCESSED_FILE_REL_PATH.\r\n\r\n## 1. Compliance\r\n- Treat every `@guidance:` comment as a **mandatory requirement**, not a suggestion.\r\n- Update the surrounding file content so it fully satisfies the guidance, using the\r\n  **most recent version** of each `@guidance:` comment as the source of truth if\r\n  multiple versions or conflicting guidance exist for the same section.\r\n- If a `@guidance:` requirement cannot be fulfilled (e.g., it conflicts with another\r\n  requirement, or is technically infeasible), do not silently skip it \u2014 flag it in the\r\n  report instead of guessing at intent.\r\n\r\n## 2. Preserving `@guidance:` comments\r\n- Every `@guidance:` comment must remain in the file, in its **original location**,\r\n  after edits are complete.\r\n- Do not add, modify, delete, or relocate `@guidance:` comments.\r\n- Only the user may create, edit, move, or remove `@guidance:` comments \u2014 this applies\r\n  to you (the LLM) regardless of how compelling a reason might seem to change one.\r\n\r\n## 3. Output\r\n- Apply all required changes directly to the file(s).\r\n- Do not alter any content unrelated to fulfilling `@guidance:` requirements.\r\n\r\n## 4. Done Validation\r\nBefore writing the report, re-read the file and verify your own work:\r\n- For **every** `@guidance:` comment in the file, re-check line by line that its\r\n  requirement is now actually reflected in the surrounding content \u2014 do not assume a\r\n  change is correct just because an edit was made near it.\r\n- Confirm every `@guidance:` comment still exists, unmodified, in its original location\r\n  (see Section 2). If any is missing, altered, or moved, this is a failure of validation\r\n  and must be corrected before proceeding.\r\n- Confirm no unrelated content was changed (see Section 3).\r\n- Classify each `@guidance:` requirement as one of:\r\n  - \u2705 **Fully complied** \u2014 requirement is completely satisfied.\r\n  - \u26A0\uFE0F **Partially complied** \u2014 some but not all of the requirement is satisfied.\r\n  - \u274C **Not complied** \u2014 requirement could not be fulfilled (per Section 1) or was not addressed.\r\n- If validation finds an unresolved or incorrect change, fix it now, then re-validate.\r\n  Only proceed to the report once no further automatic fixes are possible.\r\n\r\n## 5. Report\r\nAfter completing the updates and validation, produce a brief report:\r\n- One line per file: `\u2705 / \u26A0\uFE0F / \u274C` + short note (what changed, or what's unresolved).\r\n- Only elaborate on items that are \u26A0\uFE0F partially complied or \u274C not complied \u2014 give a\r\n  one-sentence reason.\r\n- End with a single summary line, e.g. `4/5 files fully compliant, 1 flagged`.\r\n\r\nKeep the whole report to a few lines per file \u2014 no restating guidance text, no\r\nper-guidance-item tables.

