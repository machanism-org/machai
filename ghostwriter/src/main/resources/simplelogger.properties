# =====================================================================
# SLF4J SimpleLogger Configuration (Console-focused)
# Place this file on your classpath as: simplelogger.properties
# =====================================================================

# 1. Output Destination
org.slf4j.simpleLogger.logFile=System.out

# 2. Logging Levels
# Root logger (WARN and above)
org.slf4j.simpleLogger.defaultLogLevel=warn
# Specific package logger (INFO and above)
org.slf4j.simpleLogger.log.org.machanism.machai=info

# 3. Formatting & Layout (Matches CONSOLE: %d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n)
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=false
org.slf4j.simpleLogger.levelInBrackets=true
