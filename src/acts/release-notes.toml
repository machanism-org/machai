description = '''
This act automates the generation of release notes based on git commit messages.
It collects and analyzes commits between release versions, groups changes by type, and writes them
as a new <release> record to the Maven changes XML file (src/changes/changes.xml), following the
format of the existing records and the Maven changes schema. It supports both new and existing files.
'''

# =========================
# AI Agent Instructions
# =========================
instructions = '''
You are an AI agent tasked with helping developers generate clear release notes from git commit messages
and record them in the Maven changes file `src/changes/changes.xml`.

Follow these steps:

1. **Collect Commit Messages:**
   - Gather all relevant git commit messages between the `[RELEASE_VERSION]-SNAPSHOT` update version and [RELEASE_VERSION] or last commit.
   - **Only include file changes located directly in the current project (`.`) and sub-directories.**, e.g. for git need to use `-- .` option.
   - If the `[RELEASE_VERSION]` variable is not defined, set it as the last available snapshot version and use that as the release version.

2. **Analyze and Group Changes:**
   - Categorize commits by type (Features, Fixes, Refactoring, Chores).
   - Group related changes together and merge duplicates.
   - Write each change as one concise, plain-text sentence. Include issue or pull request numbers if available.

3. **Map Change Types to `<action>` Types:**
   - New functionality                    -> `type="add"`
   - Enhancements and behavior changes    -> `type="update"`
   - Bug fixes                            -> `type="fix"`
   - Refactoring and internal cleanup     -> `type="refactor"`
   - Removals                             -> `type="remove"`
   - Chores with no user-visible impact (dependency bumps, build tweaks) may be merged into one `update` action or omitted.

4. **Save the Release Notes to `src/changes/changes.xml`:**
   - If the file does not exist, create it with the structure shown below
     (root `<document>` with a single `<body>` child, schema `https://maven.apache.org/xsd/changes-2.0.0.xsd`).
   - If the file exists, read it first and **follow the style of the existing `<release>` records**.
     Insert the new `<release>` element as the LAST child of `<body>`, keep existing records untouched,
     and keep the existing indentation (2 spaces per level).
   - The `<release>` element must have these attributes:
     - `version="[RELEASE_VERSION]"`
     - `date="[CURRENT_DATE:YYYY-MM-DD]"`
     - `description="..."` : ONE sentence (max ~150 characters) summarizing the release overall.
   - Inside `<release>`, add ONE `<action>` element PER change:
     - `dev="dev"`
     - `type="add|update|fix|refactor|remove"` (see step 3)
     - If `ISSUE_ID` is defined, add `issue="[ISSUE_ID]"`. If it is not defined, omit the `issue` attribute.
   - The text content of each `<action>` is a single plain-text sentence.
     **Do NOT use CDATA, HTML tags (`<h2>`, `<ul>`, `<li>`, etc.) or Markdown inside `<action>`.**
     Escape XML special characters (`&amp;`, `&lt;`, `&gt;`).
   - Do NOT create a single `<action>` that contains all the release notes.
   - Optionally, a change may be prefixed with a short area label and a colon,
     e.g. `Bindex Processing: Improved log output.` but only if neighbouring records use this style.

   **Example of a new release record (existing file):**
```xml
       <release version="[RELEASE_VERSION]" date="[CURRENT_DATE:YYYY-MM-DD]" description="[ONE_SENTENCE_SUMMARY]">
         <action dev="dev" type="fix">Improved resource loading behavior.</action>
         <action dev="dev" type="update">Improved picker behavior.</action>
       </release>
```

   **Example of a new file:**
```xml
   <?xml version="1.0" encoding="UTF-8"?>
   <document xmlns="http://maven.apache.org/changes/2.0.0"
             xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
             xsi:schemaLocation="http://maven.apache.org/changes/2.0.0 https://maven.apache.org/xsd/changes-2.0.0.xsd">
     <body>
       <release version="[RELEASE_VERSION]" date="[CURRENT_DATE:YYYY-MM-DD]" description="[ONE_SENTENCE_SUMMARY]">
         <action dev="dev" type="add">[CHANGE_DESCRIPTION]</action>
       </release>
     </body>
   </document>
```

   **Important:**
   - Do not include the `issue` attribute if `ISSUE_ID` is not defined.
   - Ensure the XML remains well-formed and valid according to the schema.
   - Do not modify or reformat existing `<release>` records.

5. **Clarity and Brevity:**
   - Keep the output directly actionable and avoid unnecessary explanations.
'''

# =========================
# Input Data for Agent
# =========================
inputs = '''
---
enabledTools:
    CommandFunctionTools
    FileFunctionTools
    CommandSpecFunctionTools
---
# Task

Analyze the commit messages between the `[RELEASE_VERSION]-SNAPSHOT` update version and the latest commit,
and add a new `<release>` record for version `[RELEASE_VERSION]` to the file `src/changes/changes.xml`.

**Rules:**
- Strictly exclude any documentation changes. Do not add, mention, or summarize documentation updates.
- Do not mention project version updates.
- If the `[RELEASE_VERSION]` variable is not defined, set it as the last available snapshot version and use that as the release version.
- If there are no changes, or no changes were made to the code, skip the following steps and complete the task.
- If `ISSUE_ID` is not provided or is undefined, do not set the `issue` attribute.

Steps:
1. Collect all commit messages between the `[RELEASE_VERSION]-SNAPSHOT` update version and the latest commit.
2. Analyze and group the commit messages by change type.
3. Convert each change into one plain-text `<action>` with the proper `type` (add, update, fix, refactor, remove).
4. Write a one-sentence `description` attribute for the `<release>` element.
5. Read `src/changes/changes.xml`, then append the new `<release>` as the last child of `<body>`,
   matching the format of the existing records: one `<action>` per change, plain text, no CDATA, no HTML.

Instructions:
```
${public.prompt}
```
'''

