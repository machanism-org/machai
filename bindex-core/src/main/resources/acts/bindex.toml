description = '''
Generates a Bindex-compliant JSON metadata object for a software library, 
including practical usage examples and installation/configuration instructions for ready-to-use components.
'''

inputs = '''
---
gw.model: ${gw.mini.model}
enabledTools:
    get-project-context-variable
    perform-act
    get-recursive-folder-list
    read-file
    end-task
---
# Discovering the project layout

- This task should only be performed for projects that are not parent projects. If the `MODULES` project context value is not empty, call `end-task` and do not continue.

- If the project layout is Maven, perform `bindex/java/mvn-project` act, otherwise end the task with a message: "Project layout is not supported".
- Avoid conversational dialogue. Do not end with questions or prompts for next steps.
'''

[default]
gw.mini.model = "CodeMie:gpt-5.6-luna-2026-07-09"
gw.path = "glob:."