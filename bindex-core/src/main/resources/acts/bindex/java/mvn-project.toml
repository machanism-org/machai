description = """
Generates a Bindex JSON file  object for a software library for Maven projects.
"""

instructions = '''
You are an expert developer automation agent specializing in Java builds, semantic documentation parsing, and Maven-based project indexing. 
'''

inputs = [
'''
---
gw.model: ${gw.mini.model}
enabledTools:
    get-project-context-variable
    run-sys-command
    get-recursive-file-list
    read-file
    write-file
    apply-patch-to-file
---
# Build Javadoc

- Run command:
```bash
mvn clean install javadoc:javadoc -Dshow=protected -DreportOutputDirectory="target/reports" -DdestDir="apidocs" -DskipTests -q
```

- Verify report output destination directory: `target/reports/apidocs`.
- If errors or warnings occur while generating Javadoc, fix the issues (no more than 3 iterations).
- **No Interactive Dialogue:** Do not ask any follow-up questions, do not request confirmation, and do not present choices.
''',
'''
---
enabledTools:
    get-project-context-variable
    perform-act
    run-sys-command
    list-files-in-directory
    get-recursive-folder-list
    write-file
    apply-patch-to-file
    register-bindex
    get-bindex
---
# Generation

${public.bindex_generation_rules}

# Bindex file create or update

1. Use document files and effective project build file as input information to update or create the bindex.json file.
    - The bindex.json file should be strictly conforms to the Bindex schema located at `${public.schemaUrl}`.
    - Do not deviate from the schema structure, required fields, or data types.
    - All required fields specified in the schema must be present and populated with appropriate values.
    - Optional fields should be included if relevant information is available.
    - Pay special attention to generating the `classification` property, it should contain all the information necessary to generate the embedding data.
    - For code examples, use fully qualified names and provide clear descriptions.
    - JSON data must be valid (parsable), have a convenient formatted structure, and not contain comments or unnecessary text.
    - **In the `examples` section, always include practical "how to use it" scenarios.**
        - If the library provides ready-to-use components (such as a CLI application, Maven plugin, or similar), include at least one example that demonstrates:
            - How to install the component (e.g., installation commands, dependency configuration).
            - How to configure it for use (e.g., configuration files, command-line options, environment variables).
            - How to run or invoke the component in a real-world scenario.
        - Provide step-by-step instructions and explanations for these examples.
2. Save the JSON object to `bindex.json`.
    - All double quotes (`"`) within string values in the JSON **must be escaped** as `\"`. Do not include unescaped double quotes inside any string value; this ensures the JSON remains valid and parsable.
    
# Validation

- Validate the generated `bindex.json` file using the `get-bindex` tool with a project relative path: `file://bindex.json`.
- If there are any errors, fix the file.
''',
'''
---
gw.model: ${gw.mini.model}
enabledTools:
    get-project-context-variable
    run-sys-command
    get-recursive-folder-list
    list-files-in-directory
    read-file
    write-file
    apply-patch-to-file
    get-bindex
    register-bindex
---
# Registration

- Call the `register-bindex` function to register the `bindex.json` file.
- If `bindex.json` file not found, skip this task.
- If there are any errors, fix the file.
- After registration completes, display the returned Bindex ID and a status message.
'''
]

[default]
gw.path = "glob:."
embedding.model = "CodeMie:text-embedding-005"

public.schemaUrl = "https://raw.githubusercontent.com/machanism-org/machai/refs/heads/main/bindex-core/src/main/resources/schema/bindex-schema-v2.json"
public.bindex_generation_rules = '''
- Get the `*.md` files from the `src/site/markdown` folder
- Read their `*.md` file contents and review them.
- Perform act: `bindex/java/extract-javadoc` (async: false) whith parameters:
    - gw.path = "glob:target/reports/apidocs/**/*.html". 
- Run command `mvn help:effective-pom -Doutput=target/effective-pom.xml -q` for maven) to save effective project build file. 
'''
